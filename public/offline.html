<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SaveNest</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #2563eb;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: rgba(15, 23, 42, 0.7);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        border: none;
        background: #2563eb;
        color: white;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">SN</div>
      <h1>Kamu sedang offline</h1>
      <p>SaveNest butuh koneksi internet untuk mengambil data video. Periksa koneksimu lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
